name: dockflow-company-api

x-console-logging: &console-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  worker:
    logging: *console-logging
    build: .
    command: ["node", "server/worker.js"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SERVICE_NAME: worker
      WORKSTATION_ID: ${WORKSTATION_ID:-not-configured}
      COMPANY_API_KEY: ${COMPANY_API_KEY:?Set COMPANY_API_KEY in .env}
      UBUNTU_BRIDGE_URL: ${UBUNTU_BRIDGE_URL:?Set existing Ubuntu HTTPS bridge URL in .env}
    depends_on:
      - dockflow-db
      - power-tool-db

  dockflow-db:
    logging: *console-logging
    build: .
    command: ["node", "server/dockflow-api.js"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SERVICE_NAME: dockflow-db
      WORKSTATION_ID: ${WORKSTATION_ID:-not-configured}
      PORT: 8081
      SAP_STORAGE: postgres
      SAP_AUTO_MIGRATE: "false"
      AGILE_WIFI_ENDPOINT_MODE: fixed
      POSTGRES_HOST: ${COMPANY_DB_HOST:?Set COMPANY_DB_HOST in .env}
      POSTGRES_PORT: ${COMPANY_DB_PORT:-5432}
      POSTGRES_DB: ${DOCKFLOW_COMPANY_DB_NAME:-DockFlow}
      POSTGRES_USER: ${DOCKFLOW_COMPANY_DB_USER:?Set DOCKFLOW_COMPANY_DB_USER in .env}
      POSTGRES_PASSWORD: ${DOCKFLOW_COMPANY_DB_PASSWORD:?Set DOCKFLOW_COMPANY_DB_PASSWORD in .env}
      POSTGRES_SCHEMA: ${DOCKFLOW_COMPANY_DB_SCHEMA:-Analysis}
      POSTGRES_SAP_DRESSINGS_TABLE: ${DOCKFLOW_COMPANY_DRESSINGS_TABLE:-SAPAnalysisDressings}
      POSTGRES_SAP_SAVOURY_TABLE: ${DOCKFLOW_COMPANY_SAVOURY_TABLE:-SAPAnalysisSavoury}
      POSTGRES_SSL: ${COMPANY_DB_SSL:-false}
      TZ: Asia/Manila

  power-tool-db:
    logging: *console-logging
    build: .
    command: ["node", "server/power-tool-api.js"]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_SERVICE_NAME: power-tool-db
      WORKSTATION_ID: ${WORKSTATION_ID:-not-configured}
      PORT: 8082
      POSTGRES_ENABLED: "true"
      POSTGRES_ONLY: "true"
      POWER_TOOL_AUTO_MIGRATE: "false"
      AGILE_WIFI_ENDPOINT_MODE: fixed
      POSTGRES_HOST: ${COMPANY_DB_HOST:?Set COMPANY_DB_HOST in .env}
      POSTGRES_PORT: ${COMPANY_DB_PORT:-5432}
      POSTGRES_DB: ${POWER_TOOL_COMPANY_DB_NAME:-confirmation_powertool_machine}
      POSTGRES_USER: ${POWER_TOOL_COMPANY_DB_USER:?Set POWER_TOOL_COMPANY_DB_USER in .env}
      POSTGRES_PASSWORD: ${POWER_TOOL_COMPANY_DB_PASSWORD:?Set POWER_TOOL_COMPANY_DB_PASSWORD in .env}
      POSTGRES_SCHEMA: ${POWER_TOOL_COMPANY_DB_SCHEMA:-power_tool}
      POSTGRES_SSL: ${COMPANY_DB_SSL:-false}
      TZ: Asia/Manila
